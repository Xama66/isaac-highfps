name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: .\build.bat
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: winmm-dll
          path: build/winmm.dll
